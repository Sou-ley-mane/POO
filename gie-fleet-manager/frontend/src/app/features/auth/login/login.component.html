<div class="login-page">
  <form class="login-card" (ngSubmit)="seConnecter()">
    <h1>GIE Fleet Manager</h1>
    <p class="subtitle">Connexion par téléphone et code PIN</p>

    <label>
      Numéro de téléphone
      <input type="tel" name="telephone" [(ngModel)]="telephone" required autocomplete="username" />
    </label>

    <label>
      Code PIN (4 chiffres)
      <input type="password" name="pin" [(ngModel)]="pin" required maxlength="4" pattern="\d{4}" inputmode="numeric" autocomplete="current-password" />
    </label>

    <p class="erreur" *ngIf="erreur()">{{ erreur() }}</p>

    <button type="submit" class="btn-primary" [disabled]="enCours()">
      {{ enCours() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>
</div>
