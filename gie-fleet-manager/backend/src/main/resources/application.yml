server:
  port: 8080

spring:
  application:
    name: gie-fleet-manager
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gie_fleet}
    username: ${DB_USER:gie_fleet}
    password: ${DB_PASSWORD:gie_fleet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  super-admin:
    telephone: ${SUPER_ADMIN_TELEPHONE:+000000000}
    pin-initial: ${SUPER_ADMIN_PIN_INITIAL:0000}
  jwt:
    secret: ${JWT_SECRET:changeme-super-secret-key-please-override-in-production-min-256bits}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  security:
    max-failed-attempts: 5
    lock-duration-minutes: 15
    rate-limit:
      max-requests: 10
      window-seconds: 60

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.gie.fleet: INFO
